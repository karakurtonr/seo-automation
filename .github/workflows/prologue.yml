name: Prologue Blog Automation
on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Get Shopify token
        id: token
        run: |
          TOKEN=$(curl -s -X POST "https://${{ secrets.PROLOGUE_STORE }}/admin/oauth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"client_id\":\"${{ secrets.PROLOGUE_CLIENT_ID }}\",\"client_secret\":\"${{ secrets.PROLOGUE_CLIENT_SECRET }}\",\"grant_type\":\"client_credentials\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
      - name: Run Prologue blog automation
        env:
          PROLOGUE_STORE: ${{ secrets.PROLOGUE_STORE }}
          PROLOGUE_TOKEN: ${{ steps.token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node prologue_blog_automation.js 2
